name: Debian packages

on:
  push:
    branches:
      - debian/experimental
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.suite }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: testing
            image: debian:testing
          - suite: unstable
            image: debian:sid
    env:
      DEBIAN_FRONTEND: noninteractive
      DEB_BUILD_OPTIONS: parallel=2 nocheck
      # The checkout is owned by the runner user while the container runs as
      # root, so Go's VCS stamping would fail on git's ownership check.
      GOFLAGS: -buildvcs=false

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure APT
        run: |
          # Enable deb-src for the base suite and add experimental, which has a
          # few build dependencies newer than what testing/unstable currently
          # ship. The pin keeps experimental below the base suite so only
          # packages missing from the base suite are pulled from it.
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/debian.sources
          printf 'deb http://deb.debian.org/debian experimental main\ndeb-src http://deb.debian.org/debian experimental main\n' > /etc/apt/sources.list.d/experimental.list
          printf 'Package: *\nPin: release a=experimental\nPin-Priority: 500\n' > /etc/apt/preferences.d/experimental.pref
          # Keep dh-runit from experimental: its generated dependency is
          # satisfied by the runit-helper version in testing and unstable.
          printf 'Package: dh-runit runit-helper\nPin: release a=experimental\nPin-Priority: 100\n' > /etc/apt/preferences.d/dh-runit.pref

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get build-dep -y .

      - name: Install Yarn
        run: |
          npm install -g yarn@1.22.22

      - name: Build packages
        run: |
          dpkg-buildpackage -b -uc -us

      - name: Collect packages
        run: |
          mkdir -p artifacts
          cp -v ../incus*.deb ../incus*.buildinfo ../incus*.changes artifacts/
          ls ../incus-ui-canonical_*.deb

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: incus-${{ matrix.suite }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Publish apt repository
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/debian/experimental'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "APT_GPG_PRIVATE_KEY is not set" >&2
            exit 1
          fi
          install -m 700 -d "$HOME/.gnupg"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build apt repository
        env:
          APT_GPG_KEY_ID: ${{ vars.APT_GPG_KEY_ID }}
        run: |
          ./debian/publish-apt-repo.sh artifacts/incus-testing testing artifacts/incus-unstable sid

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
